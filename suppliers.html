<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Monitoring - Supplier</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;

            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;

            --sidebar: #111827;
            --sidebar-hover: #1f2937;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 250px;
            background: var(--sidebar);
            color: white;

            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;

            z-index: 1000;
            overflow-y: auto;
        }

        .logo {
            height: 70px;

            display: flex;
            align-items: center;

            padding: 0 22px;

            border-bottom:
                1px solid rgba(255,255,255,.08);
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            background: var(--primary);

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            margin-right: 10px;
        }

        .logo-text {
            font-size: 17px;
            font-weight: bold;
        }

        .logo-subtitle {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 2px;
        }

        .menu {
            padding: 20px 12px;
        }

        .menu-title {
            font-size: 11px;
            color: #6b7280;

            text-transform: uppercase;

            margin:
                15px 10px 8px;

            font-weight: bold;

            letter-spacing: .5px;
        }

        .menu a {
            display: flex;
            align-items: center;

            gap: 12px;

            text-decoration: none;

            color: #d1d5db;

            padding: 11px 12px;

            border-radius: 8px;

            margin-bottom: 3px;

            font-size: 14px;

            transition: .2s;
        }

        .menu a:hover {
            background: var(--sidebar-hover);
            color: white;
        }

        .menu a.active {
            background: var(--primary);
            color: white;
        }

        .menu-icon {
            width: 20px;
            text-align: center;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 250px;

            width:
                calc(100% - 250px);

            min-height: 100vh;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            height: 70px;

            background: white;

            border-bottom:
                1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            position: sticky;
            top: 0;

            z-index: 500;
        }

        .page-title {
            font-size: 21px;
            font-weight: bold;
        }

        .page-date {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .notification {
            width: 38px;
            height: 38px;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background: white;

            cursor: pointer;

            position: relative;
        }

        .notification-dot {
            width: 7px;
            height: 7px;

            background: var(--danger);

            border-radius: 50%;

            position: absolute;

            right: 7px;
            top: 7px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .avatar {
            width: 38px;
            height: 38px;

            background: #dbeafe;

            color: var(--primary);

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        .profile-name {
            font-size: 13px;
            font-weight: bold;
        }

        .profile-role {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            padding: 28px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 22px;
        }

        .page-heading h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .page-heading p {
            font-size: 13px;
            color: var(--muted);
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            border: none;

            border-radius: 8px;

            padding:
                11px 16px;

            cursor: pointer;

            font-size: 13px;

            font-weight: bold;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 16px;

            margin-bottom: 22px;
        }

        .stat-card {
            background: white;

            border:
                1px solid var(--border);

            border-radius: 11px;

            padding: 18px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
        }

        .stat-value {
            font-size: 22px
